<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập phân quyền - SmartShelf</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/pages/login.css">
</head>
<body class="login-body">

  <main role="main" class="card login-card">
    <div class="login-header">
      <div class="brand-logo login-brand-logo">
        <div class="logo-icon">SS</div>
        <span>SmartShelf</span>
      </div>
      <h1 class="login-title">Đăng nhập cổng điều hành</h1>
      <p class="login-subtitle">Chọn tài khoản để bắt đầu trải nghiệm</p>
    </div>

    <!-- Quick Role Pickers for Demo -->
    <div class="quick-roles-container">
      <div class="quick-roles-title">
        ⚡ Bấm chọn nhanh tài khoản demo:
      </div>
      <div class="quick-roles-grid">
        <button type="button" class="btn btn-secondary btn-sm btn-quick-role" data-user="hoanganh" data-role="shopper">
          👤 Hoàng Anh (SV1)
        </button>
        <button type="button" class="btn btn-secondary btn-sm btn-quick-role" data-user="quanglong" data-role="associate">
          👤 Quang Long (SV2)
        </button>
        <button type="button" class="btn btn-secondary btn-sm btn-quick-role" data-user="vanhan" data-role="manager">
          👤 Văn Hân (SV3)
        </button>
        <button type="button" class="btn btn-secondary btn-sm btn-quick-role" data-user="admin" data-role="admin">
          ⚙️ Quản trị viên
        </button>
      </div>
    </div>

    <!-- Form -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="usernameInput">Tên đăng nhập</label>
        <input type="text" id="usernameInput" class="form-control" placeholder="Nhập tên đăng nhập..." required value="hoanganh">
        <div class="invalid-feedback">Vui lòng nhập tên tài khoản hợp lệ.</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="passwordInput">Mật khẩu</label>
        <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required value="123456">
        <div class="invalid-feedback">Mật khẩu không được để trống (tối thiểu 6 ký tự).</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="targetRoleSelect">Vai trò đăng nhập</label>
        <select id="targetRoleSelect" class="form-control">
          <option value="shopper">Khách mua sắm (Shopper)</option>
          <option value="associate">Nhân viên kệ hàng (Store Associate)</option>
          <option value="manager">Quản lý cửa hàng (Store Manager)</option>
          <option value="admin">Quản trị viên (Admin)</option>
        </select>
      </div>

      <button type="submit" id="loginBtn" class="btn btn-primary btn-login-submit">
        Đăng nhập vào hệ thống
      </button>
    </form>

    <div class="login-footer-link">
      <a href="../index.html">&larr; Quay lại trang chủ SmartShelf</a>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/pages/login.js"></script>
</body>
</html>
